services:
  app:
    image: ptibor84/config-store:1.0.0
    ports:
      - "3000:80"
    environment:
      - PORT=80
      - DB_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    networks:
      - config-store-net
    depends_on:
      - db

  db:
    image: postgres:17.1
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - config-store-net

networks:
  config-store-net:

volumes:
  postgres-data:
